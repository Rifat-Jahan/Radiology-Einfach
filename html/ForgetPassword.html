    <!-- <img src="../img/avatar.png" class="avatar"> -->

  </div>

    <h1>Don't worry</h1>
    <p style="color: white;
    font-weight: bold;

      <div class="content">
        <div class="form">
          <div class="user-details">

              <input type="text" id="forgetEmail" placeholder="Enter your email" required>
