function talk(){
  var know = {
    "Y" : "Reason of Reschedule? emergency / other reason?",
    "N" : "Ok! Have a Nice Day!!",
	"y" : "Reason of Reschedule? emergency / other reason?",
    "n" : "Ok! Have a Nice Day!!",
    "emergency" : "Which room has emergency? <br>CT<br>MRI<br>Ultrasound",
    "other reason" : "Ok! You can reschedule according to your personal reason.",
	"Emergency" : "Which room has emergency? <br>CT<br>MRI<br>Ultrasound",
    "Other Reason" : "Ok! You can reschedule according to your personal reason.",
	"CT": "from the previous learning or history it is suggested that you reschedule for 15 minutes",
	"MRI": "from the previous learning or history it is suggested that you reschedule for 30 minutes",
	"Ultrasound": "from the previous learning or history it is suggested that you reschedule for 20 minutes",
	"ct": "from the previous learning or history it is suggested that you reschedule for 15 minutes",
	"mri": "from the previous learning or history it is suggested that you reschedule for 30 minutes",
	"ultrasound": "from the previous learning or history it is suggested that you reschedule for 20 minutes",
	"OK": " Will meet soon. TC:)..",
	"ok": " Will meet soon. TC:)..",
	"bye" : "Bye",
    "Bye" : "Bye"
  };
  var user = document.getElementById('userBox').value;
  var messages = document.getElementById('messages');
  var q=document.getElementById('chatLog').innerHTML;
  if (user in know) {
	let p1 = document.createElement('p');
	p1.innerHTML = '<b>'+q+'</b>';
	messages.appendChild(p1);
	let p2 = document.createElement('p');
	p2.innerHTML = user;
	messages.appendChild(p2);
    document.getElementById('chatLog').innerHTML = know[user] + "<br>";
	document.getElementById('userBox').value = "";
  }
  else{
	if(user==="x"){
		while (messages.lastElementChild) {
			messages.removeChild(messages.lastElementChild);
		}
		document.getElementById('box').style.display="none";
		document.getElementById('chatLog').innerHTML = "Do you want to Reschedule Appointment? Y/N ";
		document.getElementById('userBox').value = "";
		if(status){
		setTimeout(function(){ alert("Rescheduled Time's email has been sent to patient successfully"); }, 1000);
			status=false;
			}
		
	}else{
    document.getElementById('chatLog').innerHTML = q;
	document.getElementById('userBox').value = "";}
  }
}
